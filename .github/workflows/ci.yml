name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Rust Toolchain Nightly
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: rustfmt
      - name: Format
        run: cargo +nightly fmt --check --all

  linting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
    - name: Install libraries
      run: |
        sudo apt update
        sudo apt install -y librust-alsa-sys-dev libudev-dev libwayland-dev
    - name: Rust Toolchain Clippy
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: clippy
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D clippy::unwrap_used -D clippy::expect_used

  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
    - name: Install libraries
      run: |
        sudo apt update
        sudo apt install -y librust-alsa-sys-dev libudev-dev libwayland-dev
    - name: Rust Toolchain Default
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
    - name: Build Tests
      run: cargo test --workspace --no-run
    - name: Run Tests
      run: cargo test --workspace

  tests-with-debug-utils:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
    - name: Install libraries
      run: |
        sudo apt update
        sudo apt install -y librust-alsa-sys-dev libudev-dev libwayland-dev
    - name: Rust Toolchain Default
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
    - name: Build Tests
      run: cargo test --workspace --no-run --features debug-utils
    - name: Run Tests
      run: cargo test --workspace --features debug-utils
